<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report damage | RoadSage</title><link rel="stylesheet" href="css/style.css"><script defer src="js/reports.js"></script></head><body class="app"><header><a class="logo" href="index.html">● Road<span>Sage</span></a><nav><a href="user-dashboard.html">Overview</a><a href="report-damage.html">Report damage</a><a href="my-reports.html">My reports</a><a href="location.html">Location</a></nav><button data-logout class="btn ghost">Sign out</button></header><main class="narrow"><small>COMMUNITY ROAD REPORT</small><h1>Report road damage<span class="green">.</span></h1><form id="reportForm" class="card"><label>Road damage photo</label><input id="photo" name="photo" type="file" accept="image/png,image/jpeg,image/webp" required><img id="photoPreview" class="preview hidden" alt="Photo preview"><label>Damage type</label><select name="damageType" required><option value="">Select type</option><option>Pothole</option><option>Cracked road</option><option>Waterlogging</option><option>Broken road edge</option><option>Other road damage</option></select><label>Street / landmark</label><input name="street" required placeholder="Street name or landmark"><label>Description</label><textarea name="description" rows="3" placeholder="Optional details"></textarea><label>GPS coordinates</label><div class="inline"><input id="coordinates" name="coordinates" readonly placeholder="Capture location"><button id="getLocation" type="button" class="btn ghost">⌖ Get location</button></div><p class="hint">Risk score is a rule-based estimate for this demo. Automatic image recognition requires a trained AI model; this version does not claim to detect damage from pixels.</p><button class="btn full">Submit road report →</button><p id="reportMessage" class="msg"></p></form></main></body></html>
